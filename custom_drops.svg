<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 180" width="500" height="180">
  <defs>
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="4" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="glassBody" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06" />
    </radialGradient>

    <linearGradient id="topShine" x1="30%" y1="0%" x2="70%" y2="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="bottomRim" x1="50%" y1="60%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- ============ DROP 1 — small, far left, low ============ -->
  <g transform="translate(40, 130)" filter="url(#dropShadow)">
    <ellipse cx="0" cy="0" rx="18" ry="16" fill="url(#glassBody)"
             stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    <ellipse cx="0" cy="0" rx="18" ry="16" fill="url(#bottomRim)" />
    <ellipse cx="-5" cy="-5" rx="9" ry="6" fill="url(#topShine)" />
    <ellipse cx="-7" cy="-7" rx="2.3" ry="1.4" fill="#ffffff" opacity="0.7" />
  </g>

  <!-- ============ DROP 2 — medium-large, left-center, high ============ -->
  <g transform="translate(120, 55)" filter="url(#dropShadow)">
    <ellipse cx="0" cy="0" rx="38" ry="34" fill="url(#glassBody)"
             stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    <ellipse cx="0" cy="0" rx="38" ry="34" fill="url(#bottomRim)" />
    <ellipse cx="-10" cy="-11" rx="19" ry="14" fill="url(#topShine)" />
    <ellipse cx="-15" cy="-15" rx="4.5" ry="3" fill="#ffffff" opacity="0.7" />
    <ellipse cx="-7" cy="-7" rx="1.8" ry="1.2" fill="#ffffff" opacity="0.5" />
  </g>

  <!-- ============ DROP 3 — tiny, between, mid height ============ -->
  <g transform="translate(195, 110)" filter="url(#dropShadow)">
    <ellipse cx="0" cy="0" rx="9" ry="8" fill="url(#glassBody)"
             stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    <ellipse cx="0" cy="0" rx="9" ry="8" fill="url(#bottomRim)" />
    <ellipse cx="-3" cy="-3" rx="4" ry="2.5" fill="url(#topShine)" />
    <ellipse cx="-3.5" cy="-3.5" rx="1.2" ry="0.8" fill="#ffffff" opacity="0.7" />
  </g>

  <!-- ============ DROP 4 — large, center-right, slightly low ============ -->
  <g transform="translate(285, 100)" filter="url(#dropShadow)">
    <ellipse cx="0" cy="0" rx="50" ry="44" fill="url(#glassBody)"
             stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    <ellipse cx="0" cy="0" rx="50" ry="44" fill="url(#bottomRim)" />
    <ellipse cx="-14" cy="-14" rx="25" ry="18" fill="url(#topShine)" />
    <ellipse cx="-20" cy="-20" rx="5.5" ry="3.5" fill="#ffffff" opacity="0.7" />
    <ellipse cx="-10" cy="-9" rx="2.2" ry="1.4" fill="#ffffff" opacity="0.5" />
  </g>

  <!-- ============ DROP 5 — small, far right, high ============ -->
  <g transform="translate(395, 50)" filter="url(#dropShadow)">
    <ellipse cx="0" cy="0" rx="15" ry="13" fill="url(#glassBody)"
             stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    <ellipse cx="0" cy="0" rx="15" ry="13" fill="url(#bottomRim)" />
    <ellipse cx="-4" cy="-4" rx="7" ry="5" fill="url(#topShine)" />
    <ellipse cx="-5" cy="-6" rx="2" ry="1.2" fill="#ffffff" opacity="0.7" />
  </g>

  <!-- ============ DROP 6 — medium, far right, low ============ -->
  <g transform="translate(450, 130)" filter="url(#dropShadow)">
    <ellipse cx="0" cy="0" rx="26" ry="23" fill="url(#glassBody)"
             stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    <ellipse cx="0" cy="0" rx="26" ry="23" fill="url(#bottomRim)" />
    <ellipse cx="-7" cy="-7" rx="13" ry="9" fill="url(#topShine)" />
    <ellipse cx="-10" cy="-10" rx="3.2" ry="2" fill="#ffffff" opacity="0.7" />
    <ellipse cx="-5" cy="-5" rx="1.3" ry="0.9" fill="#ffffff" opacity="0.5" />
  </g>
</svg>

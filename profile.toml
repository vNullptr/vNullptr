# ─────────────────────────────────────────────────────────────────────
#  profile.toml · single source of truth for the profile cards
#  edit this file → push → the workflow re-renders assets/*.svg
#  (or run `python scripts/render.py` locally, stdlib only, py 3.11+)
# ─────────────────────────────────────────────────────────────────────

user = "vNullptr"

[header]
title = "ryn@vnullptr: ~"
name  = "rayan"
alias = "ryn"
lines = [
  "4th-year ai engineering · morocco",
  "llms · rag · agents · ml from first principles",
]
motto = "building quietly. shipping steadily."
# causal attention over the motto tokens: row i = token i attending to tokens 0..i
# (optional; remove it and weights are generated from the motto)
attention = [
  [1.00],
  [0.35, 0.65],
  [0.15, 0.55, 0.30],
  [0.62, 0.08, 0.10, 0.20],
  [0.06, 0.58, 0.04, 0.22, 0.10],
  [0.08, 0.10, 0.36, 0.14, 0.12, 0.20],
]

# ── now ─────────────────────────────────────────────────────────────
# state: active (pulsing dot) · open (ripple) · idle (hollow)

